
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title class="cloak">MacVG GX</title>
  <link class="favicon" rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23cc0000'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="gx-theme.css">
  <script src="gx-particles.js" defer></script>
  <script src="macvg-app.js" defer></script>
</head>
<body>
  <div class="macvg-shell">
    <div class="gx-titlebar">
      <div class="logo">
        <span class="dot"></span>
        MACVG <span class="ver">GX</span>
      </div>
      <div class="wdots">
        <span class="wdot"></span>
        <span class="wdot"></span>
        <span class="wdot"></span>
      </div>
    </div>

    <nav class="gx-nav">
      <a href="./" class="active">GAMES</a>
      <a href="https://xclounkit234x.github.io/GX-Launcher/" target="_blank" rel="noopener">GX LAUNCHER</a>
      <a href="game.html">PLAYER</a>
      <div class="spacer"></div>
      <button type="button" class="icon" id="btnSettings" title="Settings">⚙</button>
    </nav>

    <main class="gx-main">
      <header class="gx-hero">
        <h1>MACVG GX <span>// LIBRARY</span></h1>
        <p>MacVG GX — unblocked games with GX blood-red theme & particles.</p>
      </header>

      <div class="gx-toolbar">
        <input type="search" id="searchInput" placeholder="Search games…" autocomplete="off">
        <button type="button" class="gx-chip" id="btnRandom">Random</button>
        <button type="button" class="gx-chip active" data-filter="all">All</button>
        <button type="button" class="gx-chip" data-filter="featured">Featured</button>
        <button type="button" class="gx-chip" data-filter="action">Action</button>
        <button type="button" class="gx-chip" data-filter="strategy">Strategy</button>
        <button type="button" class="gx-chip" data-filter="casual">Casual</button>
        <button type="button" class="gx-chip" data-filter="driving">Driving</button>
        <button type="button" class="gx-chip" data-filter="download">Downloadable</button>
      </div>

      <div class="gx-status" id="gamesStatus">Loading…</div>

      <div class="gx-section-title">RANDOM PICK</div>
      <div class="gx-grid" id="randomSlot" style="max-width:140px;margin-bottom:12px;"></div>

      <div class="gx-section-title">ALL GAMES</div>
      <div class="gx-grid" id="gamesGrid"></div>
    </main>

    <footer class="gx-footer">MACVG GX — personal build</footer>
  </div>

  <div class="gx-modal-bg" id="settingsModal">
    <div class="gx-modal">
      <h3>SETTINGS</h3>
      <label>Theme</label>
      <div class="theme-swatches">
        <button type="button" class="theme-swatch selected" data-theme="default" title="Default"></button>
        <button type="button" class="theme-swatch" data-theme="blood" title="Blood"></button>
        <button type="button" class="theme-swatch" data-theme="green" title="Green"></button>
        <button type="button" class="theme-swatch" data-theme="midnight" title="Midnight"></button>
        <button type="button" class="theme-swatch" data-theme="amber" title="Amber"></button>
        <button type="button" class="theme-swatch" data-theme="matrix" title="Matrix"></button>
      </div>
      <label for="cloakTitle">Tab title (cloak)</label>
      <input id="cloakTitle" type="text" placeholder="Google">
      <label for="cloakIcon">Favicon URL</label>
      <input id="cloakIcon" type="text" placeholder="https://…/favicon.ico">
      <div class="row">
        <button type="button" class="gx-btn" id="btnSaveCloak">Save cloak</button>
        <button type="button" class="gx-btn ghost" data-preset="Google">Google</button>
        <button type="button" class="gx-btn ghost" data-preset="Canva">Canva</button>
        <button type="button" class="gx-btn ghost" data-preset="Classroom">Classroom</button>
      </div>
      <label for="panicKey">Panic key</label>
      <input id="panicKey" type="text" maxlength="2" value="`">
      <label for="panicUrl">Panic URL</label>
      <input id="panicUrl" type="text" value="https://www.google.com">
      <div class="row">
        <button type="button" class="gx-btn" id="btnSavePanic">Save panic</button>
        <button type="button" class="gx-btn ghost" id="btnCloseSettings">Close</button>
      </div>
    </div>
  </div>
</body>
</html>
