<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>404 — n3xn × MacVG</title>
    <meta name="robots" content="noindex" />

    <style>
      /* Black-White-Glow theme */
      :root{
        --bg: #000;
        --fg: #fff;
        --muted: #bbb;
        --glow: rgba(255,255,255,0.12);
        --accent: #fff;
        --max-width: 980px;
      }

      html,body{
        height:100%;
        margin:0;
        font-family:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
        background: radial-gradient(1200px 600px at 10% 10%, rgba(255,255,255,0.02), transparent 5%),
                    radial-gradient(800px 400px at 90% 90%, rgba(255,255,255,0.02), transparent 5%),
                    var(--bg);
        color:var(--fg);
        -webkit-font-smoothing:antialiased;
        -moz-osx-font-smoothing:grayscale;
      }

      .wrap{
        min-height:100%;
        display:flex;
        align-items:center;
        justify-content:center;
        padding:48px 20px;
        box-sizing:border-box;
      }

      .card{
        width:100%;
        max-width:var(--max-width);
        text-align:center;
        padding:48px;
        border-radius:12px;
        background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
        box-shadow: 0 10px 30px rgba(0,0,0,0.6), 0 0 60px var(--glow) inset;
        backdrop-filter: blur(6px);
        border: 1px solid rgba(255,255,255,0.04);
      }

      .logo {
        display:inline-block;
        margin-bottom:18px;
        filter: drop-shadow(0 6px 18px rgba(255,255,255,0.02));
      }

      .code {
        font-weight:700;
        font-size:96px;
        line-height:1;
        letter-spacing:-4px;
        margin:8px 0 12px;
        color:var(--fg);
        text-shadow:
          0 0 6px rgba(255,255,255,0.08),
          0 6px 30px rgba(0,0,0,0.7);
      }

      .message {
        font-size:20px;
        color:var(--muted);
        margin:0 0 22px;
      }

      .desc {
        font-size:15px;
        color:rgba(255,255,255,0.9);
        margin:0 0 28px;
      }

      .actions {
        display:flex;
        gap:12px;
        justify-content:center;
        flex-wrap:wrap;
      }

      .btn {
        display:inline-flex;
        align-items:center;
        gap:10px;
        padding:10px 16px;
        border-radius:8px;
        text-decoration:none;
        color:var(--bg);
        background:var(--fg);
        font-weight:600;
        box-shadow: 0 6px 20px rgba(0,0,0,0.5), 0 0 24px rgba(255,255,255,0.04) inset;
        transition:transform .15s ease, box-shadow .15s ease;
      }

      .btn.secondary{
        color:var(--fg);
        background:transparent;
        border:1px solid rgba(255,255,255,0.06);
        box-shadow:none;
      }

      .btn:hover{ transform:translateY(-3px); }

      .subtle {
        display:block;
        margin-top:18px;
        font-size:13px;
        color:rgba(255,255,255,0.14);
        text-transform:uppercase;
        letter-spacing:1.6px;
      }

      /* small screens */
      @media (max-width:520px){
        .code{ font-size:64px; letter-spacing:-2px; }
        .card{ padding:28px; border-radius:10px; }
      }
    </style>
  </head>

  <body>
    <div class="wrap" role="main">
      <div class="card" aria-labelledby="title">
        <div class="logo" aria-hidden="true">
          <!-- Optional: replace with your SVG or image -->
          <svg width="56" height="56" viewBox="0 0 24 24" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
            <rect width="24" height="24" rx="6" fill="#fff" opacity="0.06"></rect>
            <path d="M6 17L12 7l6 10" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>

        <h1 id="title" class="code">404</h1>

        <p class="message">Page not found — n3xn × MacVG</p>

        <p class="desc">The link may be broken, or the page may have been removed. Try returning home or visiting the GitHub repo.</p>

        <div class="actions" role="navigation" aria-label="404 actions">
          <a class="btn" href="/" title="Home">Home</a>
          <a class="btn secondary" href="https://github.com/n3xn/macvg" target="_blank" rel="noopener">GitHub Repo</a>
        </div>

        <span class="subtle">If you think this is an error, open an issue on the repo.</span>
      </div>
    </div>
  </body>
</html>
