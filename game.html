
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title class="cloak">MacVG GX</title>
  <link class="favicon" rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23cc0000'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="game.css">
  <script>
    try {
      var t = localStorage.getItem("macvgTheme");
      if (t && t !== "default") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>
</head>
<body>
  <header class="gx-top">
    <span class="dot"></span>
    <a class="brand" href="./">MACVG <span>GX</span></a>
    <a class="back" href="./">← LIBRARY</a>
  </header>

  <div class="game-wrap">
    <div class="play-col">
      <div class="frame-box" id="gameframe">
        <iframe src="" id="game-frame" allowfullscreen allow="autoplay; fullscreen; gamepad; keyboard-map *"></iframe>
      </div>
      <div class="tool-bar">
        <img src="" id="game-thumb" alt="">
        <h5 class="title" id="game-name">Loading…</h5>
        <img class="icon-btn" src="media/star-regular.svg" id="star" title="Favorite" alt="star" onerror="this.style.display='none'">
        <img class="icon-btn" src="media/share-solid.svg" id="share" title="Copy link" alt="share" onerror="this.style.display='none'">
        <img class="icon-btn" src="media/download.svg" id="download" title="Download" alt="dl" onerror="this.style.display='none'">
        <img class="icon-btn" src="media/flag.svg" id="report" title="Report" alt="report" onerror="this.style.display='none'">
        <img class="icon-btn" src="media/expand.svg" id="fullscreen" title="Fullscreen" alt="fs" onerror="this.style.display='none'">
      </div>
      <div class="info-panel">
        <h3>ABOUT</h3>
        <p id="game-description"></p>
        <h3>CONTROLS</h3>
        <ul id="game-controls"></ul>
        <h3>INFO</h3>
        <ul>
          <li>Developer: <span id="game-developer"></span></li>
          <li>Category: <span id="game-category"></span></li>
          <li>Genre: <span id="game-genre"></span></li>
          <li>Players: <span id="game-popularity"></span></li>
          <li>Release: <span id="game-release"></span></li>
          <li>Build: <span id="game-build"></span></li>
        </ul>
      </div>
    </div>
    <aside class="side">
      <div class="side-title">SEARCH LIBRARY</div>
      <input type="search" id="sideSearch" placeholder="Find a game…" autocomplete="off">
      <div class="side-results" id="sideResults"></div>
    </aside>
  </div>

  <div class="share-toast none" id="game-share">
    Link copied
    <button type="button" id="game-share-btn" style="margin-left:10px;cursor:pointer;border:1px solid var(--accent);background:transparent;color:var(--accent-hi);padding:2px 8px;">OK</button>
  </div>

  <script src="game.js"></script>
  <script>
    // Side search (no ads)
    (function () {
      var input = document.getElementById("sideSearch");
      var box = document.getElementById("sideResults");
      if (!input || !box) return;
      var cache = [];
      fetch("games.json").then(function (r) { return r.json(); }).then(function (d) {
        cache = d.games || [];
      }).catch(function () {});
      input.addEventListener("input", function () {
        var q = input.value.trim().toLowerCase();
        box.innerHTML = "";
        if (!q || q.length < 2) return;
        cache.filter(function (g) {
          return String(g.name || "").toLowerCase().indexOf(q) !== -1;
        }).slice(0, 20).forEach(function (g) {
          var a = document.createElement("a");
          a.href = "game.html?target=" + encodeURIComponent(String(g.id));
          a.textContent = g.name;
          box.appendChild(a);
        });
      });
    })();
  </script>
</body>
</html>
